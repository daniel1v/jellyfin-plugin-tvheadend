changelog: |-
  The guide knows more than it was letting on.

  TVHeadend has been sending a production year, the broadcaster's own rating, whether a programme
  is a premiere or a repeat, which episode of what it is, and the categories the broadcaster files
  it under. All of that was arriving and being dropped. It now reaches Jellyfin, so the guide and
  your recordings look like the rest of your library instead of a bare list of times and titles.
  The rating is put on Jellyfin's scale rather than passed through as whatever number the
  broadcaster meant. Nothing is invented: where a channel says nothing, nothing is shown.

  The guide is also asked in your language. Jellyfin's preferred metadata language is now passed
  on to TVHeadend, so a channel that broadcasts its listings in more than one gives you yours.

  Playback got steadier rather than cleverer. A live channel and a recording of the same broadcast
  are now described to your client the same way -- same codec names, same audio tracks, same
  container -- so a client that plays one plays the other. Seeking inside a recording has its own
  tests now, after a version in which it quietly stopped working. MPEG-2 and everything else that
  your client can already play is still handed over untouched; the re-encode for Android's fussier
  decoder still happens only for the channels that genuinely need it, and only for that client.

  The recordings folder no longer borrows its picture. It was fetched at runtime from the official
  Jellyfin TVHeadend project's repository -- another project's artwork, on another project's
  server, for a plugin that is not theirs. It has none of its own for now, which is the honest
  answer.

  Under the hood this release is mostly a rebuild of how the plugin is put together, with tests
  that fail the build if the pieces start reaching into each other again. You should not be able
  to see any of it. That is the intention.
