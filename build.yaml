changelog: |-
  Fixes 13.2.0.0, which does not play at all on a server with hardware acceleration configured.

  The media source named its container as both spellings at once, "mpegts,ts", so that client device profiles split over the two would each match. Jellyfin hands the container of a media source straight to FFmpeg as "-f" whenever hardware acceleration is configured, and does not check it -- so FFmpeg was asked to open the stream with a demuxer that does not exist: "Unknown input format: 'mpegts,ts'", and every channel and every recording failed to start. Without hardware acceleration the argument is never added, which is why this survived testing.

  The container is now named once, as "mpegts". That is what FFprobe reports, what this plugin's own transport stream check already used, and a demuxer FFmpeg has. A client whose device profile lists only "ts" no longer matches on the container and is given a remux instead of direct play -- worse for that client, where the alternative was nothing playing for anyone.
